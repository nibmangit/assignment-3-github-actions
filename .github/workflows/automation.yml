name: Automation Demo

on:
  pull_request:
    types: [opened]

jobs:
  demo:
    runs-on: ubuntu-latest

    steps:
      - name: Print message
        run: echo "Automation workflow triggered successfully"

      - name: Create demo file
        run: echo "Workflow triggered!" > demo.txt

      - name: Upload demo artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-artifact
          path: demo.txt
